<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bad request · DocTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-code">400</div>
      <h1>The form could not be verified</h1>
      <p>{{ message or "The request was incomplete or the security token expired." }}</p>
      <div class="d-flex gap-2 justify-content-center">
        <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
        <a class="btn btn-soft" href="{{ url_for('auth.login') }}">Sign in again</a>
      </div>
    </div>
  </div>
</body>
</html>
